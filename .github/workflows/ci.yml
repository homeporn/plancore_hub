name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    name: migrations apply + types in sync
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Apply every migration to a clean database. Stub the Supabase-managed
      # `auth` objects the schema references so it resolves standalone.
      - name: Apply migrations to a fresh database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role;
          create schema if not exists auth;
          create schema if not exists extensions;
          create table auth.users (id uuid primary key default gen_random_uuid());
          create or replace function auth.uid() returns uuid language sql stable as $$ select '00000000-0000-0000-0000-000000000000'::uuid $$;
          SQL
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Guard against schema drift: the committed DB types must match what the
      # Supabase CLI would generate from the migrated schema.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Check generated types are in sync (advisory)
        continue-on-error: true
        env:
          PGPASSWORD: postgres
        run: |
          npx --yes supabase@latest gen types typescript \
            --db-url "postgresql://postgres:postgres@localhost:5432/postgres" \
            --schema public > /tmp/generated.types.ts
          if ! diff -u packages/data/src/supabase/database.types.ts /tmp/generated.types.ts; then
            echo "::warning::database.types.ts differs from types generated off the migrations."
            echo "If the schema changed intentionally, regenerate with:"
            echo "  supabase gen types typescript --schema public > packages/data/src/supabase/database.types.ts"
          fi
